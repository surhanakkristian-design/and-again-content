<style>
:root{--bg:#111214;--card:#1c1d21;--line:#2c2e34;--text:#e8e8ea;--muted:#9a9ca3;--green:#4ade80;--red:#f87171;--pill:#2a2c33;--accent:#AC3C72}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:rgba(17,18,20,.96);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}.count{color:var(--muted);font-weight:400;font-size:14px;margin-left:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.row>span{color:var(--muted);font-size:12px;min-width:70px}
button{background:var(--pill);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}button small{opacity:.7;margin-left:3px}
input[type=search]{background:var(--pill);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:min(360px,100%);font-size:14px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media(max-width:560px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;aspect-ratio:9/16;background:#000;border-radius:12px;margin:8px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb a{display:block;height:100%}.play{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);border-radius:999px;padding:2px 9px;font-size:12px}
.body{padding:4px 12px 12px}.meta{color:var(--muted);font-size:12px}.meta b{color:var(--text);font-size:14px}
.s{margin:6px 0;padding:6px 8px;border-radius:8px;display:flex;gap:8px;justify-content:space-between}
.t{background:rgba(74,222,128,.1);color:var(--green)}.f{background:rgba(248,113,113,.1);color:var(--red)}
.n{font-size:11px;opacity:.75;white-space:nowrap}.n.over{color:#fbbf24;opacity:1}
.tone{display:inline-block;background:var(--pill);border-radius:999px;padding:2px 9px;font-size:11px;margin-top:4px}
.desc{color:var(--muted);font-size:12px;margin-top:6px}
.empty{color:var(--muted);padding:40px;text-align:center;grid-column:1/-1}

const keys=['tone','level','media_type','category'];
const sel={tone:null,level:null,media_type:null,category:null};let q='';

function match(d,skip){if(q){const h=[d.media_id,d.word,d.true_sentence,d.false_sentence,d.description,d.category,d.tone].join(' ').toLowerCase();if(!h.includes(q))return false}
 return keys.every(k=>k===skip||!sel[k]||d[k]===sel[k])}
function buildFilters(){for(const k of keys){const box=document.getElementById('f-'+k);box.querySelectorAll('button').forEach(b=>b.remove());

 const mk=(label,v,n)=>{const b=document.createElement('button');b.innerHTML=esc(label)+'<small>'+n+'</small>';if(sel[k]===v)b.className='on';

 mk('All',null,pool.length);for(const v of vals)mk(v,v,pool.filter(d=>d[k]===v).length)}}
